name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker-image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shortener
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t url-shortener:ci .

      - name: Start the container
        run: |
          docker run -d --name app --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/shortener \
            -e DB_USER=shortener \
            -e DB_PASSWORD=shortener \
            -e REDIS_HOST=localhost \
            -e APP_BASE_URL=http://localhost:8080 \
            url-shortener:ci

      - name: Smoke test
        run: |
          chmod +x smoke-test.sh
          ./smoke-test.sh http://localhost:8080 --wait 120 --rate-limit

      - name: Show application logs when something fails
        if: failure()
        run: docker logs app

      - name: Clean up
        if: always()
        run: docker rm -f app