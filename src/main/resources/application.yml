spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 500ms
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug
    com.bhavesh.urlshortner.service.ClickService: debug

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    link-ttl: 1h
    negative-ttl: 30s

  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:10}
    refill-period: ${RATE_LIMIT_REFILL_PERIOD:1m}
    max-tracked-clients: 10000
    client-idle-ttl: 10m

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}