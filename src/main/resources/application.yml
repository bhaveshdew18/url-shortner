spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 500ms
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug
    com.bhavesh.urlshortner.service.ClickService: debug

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    link-ttl: 1h
    negative-ttl: 30s